<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tercer Aniversario · Refugio de Vida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Jost:wght@300;400;500;600&family=Alex+Brush&display=swap" rel="stylesheet">
<style>
  :root{
    --black:   #0A0705;
    --black2:  #120D09;
    --gold:    #E9C876;
    --gold-lt: #F6E3A8;
    --gold-dk: #B8912F;
    --cream:   #F2E5C6;
  }

  *{ box-sizing:border-box; }

  html, body{
    margin:0;
    min-height:100vh;
  }

  body{
    font-family:'Jost', sans-serif;
    font-weight:300;
    color: var(--cream);
    background: radial-gradient(120% 90% at 50% 0%, #17110c 0%, var(--black) 55%, #060403 100%);
    -webkit-font-smoothing:antialiased;
  }

  .wrap{
    max-width:520px;
    margin:0 auto;
    padding: 56px 20px 70px;
    position:relative;
    overflow:hidden;
  }

  .globo-top{
    position:absolute;
    top:-20px;
    right:-40px;
    width:170px;
    height:auto;
    opacity:0.95;
    pointer-events:none;
    z-index:0;
  }

  .globo-bottom{
    position:absolute;
    top:-20px;
    left:-50px;
    width:190px;
    height:auto;
    opacity:0.95;
    transform: scaleX(-1);
    pointer-events:none;
    z-index:0;
  }

  .card{
    position:relative;
    z-index:1;
    text-align:center;
  }

  .logo{
    width:210px;
    height:auto;
    margin: 0 auto 20px;
    display:block;
  }

  .eyebrow{
    font-family:'Jost', sans-serif;
    font-weight:500;
    font-size:0.72rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color: var(--gold-lt);
    margin: 0 0 4px;
    line-height:1.6;
  }

  .num-grande{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size: 4.6rem;
    line-height:1;
    color: var(--gold);
  }

  .aniversario-script{
    font-family:'Alex Brush', 'Cormorant Garamond', cursive;
    font-size: 2.6rem;
    color: var(--gold);
    line-height:1;
  }

  .titulo-wrap{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin: 18px 0 22px;
  }

  .fecha-row{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:22px;
    margin: 0 0 6px;
  }

  .fecha-mes{
    font-family:'Jost', sans-serif;
    font-weight:500;
    font-size:0.85rem;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color: var(--cream);
    opacity:0.85;
  }

  .fecha-dia{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:2.4rem;
    color: var(--gold);
  }

  .fecha-hora{
    font-family:'Jost', sans-serif;
    font-weight:400;
    font-size:0.9rem;
    letter-spacing:0.06em;
    color: var(--cream);
    opacity:0.85;
  }

  .lugar{
    font-size:0.92rem;
    letter-spacing:0.04em;
    color: var(--cream);
    opacity:0.7;
    margin: 0 0 24px;
    text-transform:uppercase;
  }

  .seccion-titulo{
    font-family:'Jost', sans-serif;
    font-weight:600;
    font-size:0.95rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color: var(--gold-lt);
    margin: 0 0 26px;
  }

  form{ display:flex; flex-direction:column; gap:24px; text-align:left; }

  .field{ display:flex; flex-direction:column; gap:8px; }

  .field label,
  .invitados-wrap label{
    font-family:'Jost', sans-serif;
    font-weight:600;
    font-size:0.8rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color: var(--gold-lt);
  }

  input[type="text"],
  input[type="number"],
  select{
    font-family:'Jost', sans-serif;
    font-size:1.12rem;
    font-weight:400;
    color: var(--cream);
    background:transparent;
    border:none;
    border-bottom: 1px solid rgba(233,200,118,0.4);
    padding: 8px 2px 10px;
    outline:none;
    border-radius:0;
    -webkit-appearance:none;
    appearance:none;
    transition: border-color .2s ease;
  }

  select{
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%23E9C876' stroke-width='1.3' fill='none' fill-rule='evenodd'/></svg>");
    background-repeat:no-repeat;
    background-position: right 4px center;
    padding-right:20px;
  }

  input::placeholder{ color: rgba(242,229,198,0.35); font-weight:300; }

  input:focus, select:focus{
    border-bottom-color: var(--gold);
    border-bottom-width: 2px;
    padding-bottom: 9px;
  }

  .row2{
    display:flex;
    gap:20px;
  }
  .row2 .field{ flex:1; }

  .check-field{
    display:flex;
    align-items:center;
    gap:12px;
    padding-top:4px;
  }

  .check-field input[type="checkbox"]{
    appearance:none;
    -webkit-appearance:none;
    width:20px;
    height:20px;
    border:1.5px solid var(--gold);
    cursor:pointer;
    position:relative;
    flex:none;
    margin:0;
    background:transparent;
  }
  .check-field input[type="checkbox"]:checked{
    background: var(--gold);
    border-color: var(--gold);
  }
  .check-field input[type="checkbox"]:checked::after{
    content:"";
    position:absolute;
    left:6px; top:2px;
    width:5px; height:10px;
    border:solid var(--black);
    border-width:0 2px 2px 0;
    transform: rotate(40deg);
  }

  .check-field label{
    font-family:'Jost', sans-serif;
    font-weight:500;
    font-size:1rem;
    color: var(--cream);
    letter-spacing:0.01em;
    cursor:pointer;
  }

  .invitados-wrap{
    display:none;
    width: calc(50% - 10px);
    animation: fadeSlide .25s ease forwards;
  }
  .invitados-wrap.show{ display:flex; flex-direction:column; gap:8px; }

  @keyframes fadeSlide{
    from{ opacity:0; transform:translateY(-4px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .btn{
    margin-top:8px;
    font-family:'Jost', sans-serif;
    font-weight:600;
    font-size:0.9rem;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color: var(--black);
    background: linear-gradient(135deg, var(--gold-dk), var(--gold-lt));
    border:none;
    padding:18px 20px;
    cursor:pointer;
    transition: opacity .2s ease, transform .15s ease;
  }
  .btn:hover{ opacity:0.9; }
  .btn:disabled{ opacity:0.5; cursor:default; }

  .btn-outline{
    margin-top:20px;
    background:transparent;
    color: var(--gold);
    border: 1px solid var(--gold);
    padding:16px 20px;
    font-family:'Jost', sans-serif;
    font-weight:600;
    font-size:0.85rem;
    letter-spacing:0.18em;
    text-transform:uppercase;
    cursor:pointer;
    transition: background .2s ease, color .2s ease;
  }
  .btn-outline:hover{ background: var(--gold); color: var(--black); }

  form.hide{ display:none; }

  .success{
    display:none;
    text-align:center;
  }
  .success.show{ display:block; animation: fadeSlide .3s ease forwards; }

  .check-mark{
    width:54px; height:54px;
    margin: 0 auto 18px;
    border: 1px solid var(--gold);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .check-mark svg{ width:22px; height:22px; }

  .success h2{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:600;
    font-size:2.1rem;
    color: var(--gold);
    margin: 0 0 10px;
  }

  .success p{
    font-size:1.08rem;
    line-height:1.6;
    color: var(--cream);
    opacity:0.9;
    margin: 0 0 6px;
  }

  .success .familia-nombre{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:600;
    color: var(--gold);
  }

  .resumen{
    margin: 24px 0 6px;
    padding: 18px 0;
    border-top: 1px solid rgba(233,200,118,0.3);
    border-bottom: 1px solid rgba(233,200,118,0.3);
    display:flex;
    justify-content:center;
    gap: 32px;
  }
  .resumen div{ text-align:center; }
  .resumen .num{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:2rem;
    color: var(--gold);
    display:block;
    line-height:1;
  }
  .resumen .lbl{
    font-size:0.72rem;
    font-weight:500;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color: var(--cream);
    opacity:0.7;
  }

  @media (max-width:480px){
    .wrap{ padding: 40px 16px 56px; }
    .logo{ width:170px; }
    .num-grande{ font-size:3.6rem; }
    .aniversario-script{ font-size:2.1rem; }
    .fecha-dia{ font-size:2rem; }
    .globo-top{ width:120px; top:-10px; right:-30px; }
    .globo-bottom{ width:135px; top:-10px; left:-35px; }
    .row2{ gap:14px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <img class="globo-top" src="1.png" alt="">
  <img class="globo-bottom" src="1.png" alt="">

  <div class="card">

    <img class="logo" src="2.png" alt="Iglesia Misionera Refugio de Vida">

    <p class="eyebrow">Celebramos con gratitud<br>un año más de la fidelidad de Dios</p>

    <div class="titulo-wrap">
      <span class="num-grande">3</span><span class="aniversario-script">Aniversario</span>
    </div>

    <div class="fecha-row">
      <span class="fecha-mes">Agosto</span>
      <span class="fecha-dia">29</span>
      <span class="fecha-hora">06:00 P.M.</span>
    </div>
    <p class="lugar" id="fecha-evento">Escuela Brassavola 7 Ave. 9 Calle</p>

    <p class="seccion-titulo">Registro de asistencia por familia</p>

    <form id="form-inscripcion" action="https://formsubmit.co/Trejomc.25@gmail.com" method="POST">
      <input type="hidden" name="_subject" value="Nueva confirmación · Tercer Aniversario RV">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_template" value="table">
      <input type="text" name="_honey" style="display:none">

      <div class="field">
        <label for="input-familia">Familia</label>
        <input type="text" id="input-familia" name="Familia" placeholder="Ej. Rivas García" required>
      </div>

      <div class="row2">
        <div class="field">
          <label for="input-adultos">Adultos</label>
          <input type="number" id="input-adultos" name="Cantidad de Adultos" placeholder="3" min="1" max="30" required>
        </div>
        <div class="field">
          <label for="input-ninos">Niños</label>
          <input type="number" id="input-ninos" name="Cantidad de Niños" placeholder="1" min="0" max="30" required>
        </div>
      </div>

      <div class="check-field">
        <input type="checkbox" id="check-invitados" name="Llevan Invitados" value="Sí">
        <label for="check-invitados">¿Llevarán invitados?</label>
      </div>

      <div class="invitados-wrap" id="invitados-wrap">
        <label for="select-invitados">Cantidad de invitados</label>
        <input type="number" id="select-invitados" name="Cantidad de Invitados" placeholder="2" min="1" max="30">
      </div>

      <button type="submit" id="btn-enviar" class="btn">Confirmar asistencia</button>
    </form>

    <div class="success" id="success-msg">
      <div class="check-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="#E9C876" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h2>Confirmación recibida</h2>
      <p>Familia <span class="familia-nombre" id="familia-out"></span>, esperamos celebrar este tercer aniversario junto a ustedes.</p>

      <div class="resumen">
        <div><span class="num" id="out-adultos">0</span><span class="lbl">Adultos</span></div>
        <div><span class="num" id="out-ninos">0</span><span class="lbl">Niños</span></div>
        <div id="out-invitados-wrap" style="display:none;"><span class="num" id="out-invitados">0</span><span class="lbl">Invitados</span></div>
      </div>

      <button type="button" id="btn-otro" class="btn-outline">Registrar otra familia</button>
    </div>

  </div>
</div>

<script>
  const FECHA_LIMITE = new Date("2026-08-25T23:59:59");
  const form = document.getElementById('form-inscripcion');
  const successMsg = document.getElementById('success-msg');
  const checkInvitados = document.getElementById('check-invitados');
  const invitadosWrap = document.getElementById('invitados-wrap');
  const selectInvitados = document.getElementById('select-invitados');
  const btnOtro = document.getElementById('btn-otro');

  window.addEventListener('DOMContentLoaded', () => {
    if (new Date() > FECHA_LIMITE) {
      form.classList.add('hide');
    }
  });

  checkInvitados.addEventListener('change', () => {
    if (checkInvitados.checked) {
      invitadosWrap.classList.add('show');
      selectInvitados.required = true;
    } else {
      invitadosWrap.classList.remove('show');
      selectInvitados.required = false;
      selectInvitados.value = "";
    }
  });

  form.addEventListener('submit', function(e){
    e.preventDefault();

    const familia = document.getElementById('input-familia').value;
    const adultos = document.getElementById('input-adultos').value;
    const ninos = document.getElementById('input-ninos').value;
    const llevaInvitados = checkInvitados.checked;
    const cantidadInvitados = selectInvitados.value;

    const btnSubmit = document.getElementById('btn-enviar');
    btnSubmit.innerText = "Enviando...";
    btnSubmit.disabled = true;

    function mostrarExito(){
      mostrarResumen(familia, adultos, ninos, llevaInvitados, cantidadInvitados);
    }

    if (window.location.protocol === 'file:') {
      mostrarExito();
      return;
    }

    const data = new FormData(form);
    fetch(form.action, {
      method: 'POST',
      body: data,
      headers: { 'Accept': 'application/json' }
    }).then(() => {
      mostrarExito();
    }).catch(() => {
      mostrarExito();
    });
  });

  function mostrarResumen(familia, adultos, ninos, llevaInvitados, cantidadInvitados){
    form.classList.add('hide');
    successMsg.classList.add('show');

    document.getElementById('familia-out').innerText = familia;
    document.getElementById('out-adultos').innerText = adultos || '0';
    document.getElementById('out-ninos').innerText = ninos || '0';

    const invitadosWrapOut = document.getElementById('out-invitados-wrap');
    if (llevaInvitados && cantidadInvitados) {
      invitadosWrapOut.style.display = 'block';
      document.getElementById('out-invitados').innerText = cantidadInvitados;
    } else {
      invitadosWrapOut.style.display = 'none';
    }
  }

  btnOtro.addEventListener('click', () => {
    form.reset();
    invitadosWrap.classList.remove('show');
    const btnSubmit = document.getElementById('btn-enviar');
    btnSubmit.innerText = "Confirmar asistencia";
    btnSubmit.disabled = false;
    successMsg.classList.remove('show');
    form.classList.remove('hide');
  });
</script>
</body>
</html>
